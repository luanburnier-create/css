<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de Postagens Horizontais</title>
  <style>
    /* Estilos gerais da página */
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f9;
      margin: 0;
      padding: 20px;
    }

    /* Contêiner principal dos cards */
    .container {
      display: flex;
      flex-direction: column;
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    /* Seletor article configurado conforme solicitado */
    article {
      display: flex;
      
      /* 1. Altera a exibição do conteúdo para linha (um ao lado do outro) */
      flex-direction: row;
      
      /* 2. Ocupa 100% da largura da página */
      flex: 1 1 100%;
      width: 100%;

      /* Estilização visual do card */
      background-color: #ffffff;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 15px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      box-sizing: border-box;
      align-items: center; /* Alinhamento vertical padrão no centro */
      gap: 20px;
    }

    /* Ajuste da imagem dentro do card */
    article img {
      width: 150px;
      height: 100px;
      object-fit: cover;
      border-radius: 4px;
    }

    /* Ajuste do bloco de texto para expandir e preencher o espaço central */
    .conteudo {
      flex: 1;
    }

    .conteudo h2 {
      margin-top: 0;
      margin-bottom: 10px;
      color: #333;
    }

    .conteudo p {
      margin: 0;
      color: #666;
    }

    /* 3. Propriedade align-self aplicada ao botão para quebrar o alinhamento centralizado */
    article button {
      /* Empurra apenas o botão para o canto inferior do card */
      align-self: flex-end; 
      
      background-color: #0066cc;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 4px;
      cursor: pointer;
    }

    article button:hover {
      background-color: #004999;
    }
  </style>
</head>
<body>

  <main class="container">
    
    <article>
      <img src="https://via.placeholder.com/150" alt="Imagem da postagem">
      
      <div class="conteudo">
        <h2>Primeira Postagem</h2>
        <p>Este é o texto da primeira postagem. Repare que a imagem, o texto e o botão estão alinhados lado a lado na horizontal.</p>
      </div>

      <button>Ler mais</button>
    </article>

    <article>
      <img src="https://via.placeholder.com/150" alt="Imagem da postagem">
      
      <div class="conteudo">
        <h2>Segunda Postagem</h2>
        <p>Cada card ocupa 100% da largura total do contêiner, formando uma lista horizontal empilhada.</p>
      </div>

      <button>Ler mais</button>
    </article>

  </main>

</body>
</html>
